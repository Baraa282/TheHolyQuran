        let quranText = null; // Store loaded qpc-hafs.json data
        let tajweedData = null; // Store loaded qpc-hafs-tajweed.json data

        // Normalize qpc-hafs.json data (handles word-level or verse-level format)
        function normalizeQpcData(rawData) {
            if (!rawData || Array.isArray(rawData)) return rawData;
            
            const firstKey = Object.keys(rawData)[0];
            const sample = firstKey ? rawData[firstKey] : null;
            const looksWordLevel = sample && (sample.word || (sample.location && sample.location.split(':').length === 3));
            if (!looksWordLevel) return rawData; // Already verse-level
            
            const verseMap = {};
            
            for (const key in rawData) {
                if (!Object.prototype.hasOwnProperty.call(rawData, key)) continue;
                const entry = rawData[key] || {};
                
                const locParts = (entry.location && typeof entry.location === 'string') ? entry.location.split(':') : [];
                const surahNum = parseInt(entry.surah || locParts[0], 10);
                const ayahNum = parseInt(entry.ayah || locParts[1], 10);
                const wordNum = parseInt(entry.word || locParts[2] || '0', 10);
                
                if (!surahNum || !ayahNum) continue;
                
                const verseKey = `${surahNum}:${ayahNum}`;
                if (!verseMap[verseKey]) {
                    verseMap[verseKey] = {
                        surah: surahNum,
                        ayah: ayahNum,
                        words: []
                    };
                }
                
                verseMap[verseKey].words.push({
                    num: isNaN(wordNum) ? 0 : wordNum,
                    text: entry.text || ''
                });
            }
            
            const normalized = {};
            Object.keys(verseMap).forEach(key => {
                const verse = verseMap[key];
                verse.words.sort((a, b) => a.num - b.num);
                const verseText = verse.words.map(w => w.text).join(' ').trim();
                normalized[key] = {
                    surah: verse.surah,
                    ayah: verse.ayah,
                    verse_key: key,
                    text: verseText
                };
            });
            
            return normalized;
        }

        // Load qpc-hafs.json
        async function loadQuranText() {
            try {
                const response = await fetch('data/quran/qpc-hafs.json');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error('Response is not JSON');
                }
                const text = await response.text();
                if (text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html')) {
                    throw new Error('Received HTML instead of JSON');
                }
                const parsed = JSON.parse(text);
                quranText = normalizeQpcData(parsed);
                console.log('Quran text loaded successfully');
            } catch (error) {
                console.error('Failed to load qpc-hafs.json:', error);
                quranText = null;
            }
        }

        // Load qpc-hafs-tajweed.json
        async function loadTajweedData() {
            try {
                const response = await fetch('data/quran/qpc-hafs-tajweed.json');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error('Response is not JSON');
                }
                const text = await response.text();
                if (text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html')) {
                    throw new Error('Received HTML instead of JSON');
                }
                tajweedData = JSON.parse(text);
                console.log('Tajweed data loaded successfully');
            } catch (error) {
                console.warn('Failed to load qpc-hafs-tajweed.json:', error);
                tajweedData = null;
            }
        }

        // Get words for a verse from tajweed data
        function getWordsForVerse(surahNum, ayahNum) {
            if (!tajweedData) return null;
            
            const words = [];
            let wordNum = 1;
            
            // Look for words in tajweed data: "surah:ayah:word"
            while (true) {
                const wordKey = `${surahNum}:${ayahNum}:${wordNum}`;
                const word = tajweedData[wordKey];
                if (!word) break;
                words.push(word);
                wordNum++;
            }
            
            return words.length > 0 ? words : null;
        }

        // Get verse text with tajweed rules (processes HTML tags)
        function getVerseTextWithTajweed(surahNum, ayahNum) {
            const words = getWordsForVerse(surahNum, ayahNum);
            if (!words || words.length === 0) return null;
            
            // Combine all words with spaces
            const combinedText = words.map(w => w.text || '').join(' ');
            
            // Convert <rule class=className>content</rule> to <span class="className">content</span>
            // Handle both quoted and unquoted class attributes
            let result = combinedText
                .replace(/<rule\s+class=["']?([^\s>"']+)["']?\s*>/gi, '<span class="$1">')
                .replace(/<\/rule>/gi, '</span>');
            
            return result;
        }

        // Get verses for a page using QuranData.Page
        function getVersesForPage(pageNumber) {
            if (!quranText || !window.QuranData || !QuranData.Page || !QuranData.Page[pageNumber]) {
                return [];
            }
            
            const currentPageStart = QuranData.Page[pageNumber];
            const nextPageStart = QuranData.Page[pageNumber + 1];
            
            if (!currentPageStart || currentPageStart.length < 2) {
                return [];
            }
            
            const startSurah = currentPageStart[0];
            const startAyah = currentPageStart[1];
            
            let endSurah, endAyah;
            if (nextPageStart && nextPageStart.length >= 2) {
                endSurah = nextPageStart[0];
                endAyah = nextPageStart[1] - 1;
                
                if (endAyah < 1) {
                    endSurah = endSurah - 1;
                    if (QuranData.Sura && QuranData.Sura[endSurah]) {
                        endAyah = QuranData.Sura[endSurah][1];
                    } else {
                        endAyah = 1;
                    }
                }
            } else {
                endSurah = 114;
                endAyah = 6;
            }
            
            const verses = [];
            let currentSurah = startSurah;
            let currentAyah = startAyah;
            
            while (true) {
                if (currentSurah > endSurah || (currentSurah === endSurah && currentAyah > endAyah)) {
                    break;
                }
                
                const verseKey = `${currentSurah}:${currentAyah}`;
                const verse = quranText[verseKey];
                if (verse) {
                    verses.push(verse);
                }
                
                currentAyah++;
                
                if (QuranData.Sura && QuranData.Sura[currentSurah]) {
                    const maxAyahs = QuranData.Sura[currentSurah][1];
                    if (currentAyah > maxAyahs) {
                        currentSurah++;
                        currentAyah = 1;
                    }
                } else {
                    const nextVerseKey = `${currentSurah}:${currentAyah}`;
                    if (!quranText[nextVerseKey]) {
                        currentSurah++;
                        currentAyah = 1;
                    }
                }
                
                if (currentSurah > 114) break;
            }
            
            return verses;
        }

        function createCalendar() {
            const readPages = JSON.parse(localStorage.getItem('readPages') || '[]');
            const calendar = document.getElementById('calendar');
            calendar.innerHTML = '';
            
            for (let i = 1; i <= 604; i++) {
                const page = document.createElement('div');
                page.className = `page-number ${readPages.includes(i) ? 'read-page' : ''}`;
                page.textContent = i;
                page.onclick = () => loadPage(i);
                calendar.appendChild(page);
            }
        }

        async function loadPage(pageNumber) {
            try {
                currentPage = pageNumber;
                showSpinner();
                
                // Use page number directly (1.jpg, 2.jpg, etc.)
                const imagePath = `hafs-wasat/${pageNumber}.jpg`;
                
                // Create image element
                const content = `<img src="${imagePath}" alt="صفحة ${pageNumber}" class="page-svg" onerror="this.style.display='none'; alert('فشل تحميل الصفحة');">`;

                document.getElementById('page-content').innerHTML = content;
                document.getElementById('modal').style.display = 'flex';
                document.body.classList.add('modal-open');
                document.documentElement.classList.add('modal-open');
                updateMarkButton();
                hideSpinner();
            } catch (error) {
                alert('حدث خطأ أثناء تحميل الصفحة');
                console.error(error);
                hideSpinner();
            }
        }


        function showSpinner() {
            document.getElementById('spinner').style.display = 'block';
        }

        function hideSpinner() {
            document.getElementById('spinner').style.display = 'none';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.body.classList.remove('modal-open');
            document.documentElement.classList.remove('modal-open');
        }

        function togglePageMark() {
            const readPages = JSON.parse(localStorage.getItem('readPages') || '[]');
            const index = readPages.indexOf(currentPage);
            
            if (index === -1) {
                readPages.push(currentPage);
            } else {
                readPages.splice(index, 1);
            }
            
            localStorage.setItem('readPages', JSON.stringify(readPages));
            createCalendar();
            updateMarkButton();
        }

        function updateMarkButton() {
            const readPages = JSON.parse(localStorage.getItem('readPages') || '[]');
            const btn = document.getElementById('markReadHeaderBtn');
            const isRead = readPages.includes(currentPage);
            
            if (btn) {
                btn.textContent = isRead ? 'Unmark ✗' : 'Mark as Read ✓';
                btn.classList.toggle('marked', isRead);
            }
        }

        function resetAllPages() {
            const readPages = JSON.parse(localStorage.getItem('readPages') || '[]');
            
            if (readPages.length === 0) {
                alert('No pages are marked as read.');
                return;
            }
            
            if (confirm(`Are you sure you want to reset all ${readPages.length} marked pages?`)) {
                localStorage.setItem('readPages', JSON.stringify([]));
                createCalendar();
                
                // If modal is open, update the mark button
                if (currentPage) {
                    updateMarkButton();
                }
            }
        }

        function handleTouchStart(e) {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }

        function handleTouchEnd(e) {
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            handleSwipe();
        }

        function handleSwipe() {
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;
            
            // Minimum swipe distance (50px)
            const minSwipeDistance = 50;
            
            // Check if horizontal swipe is greater than vertical (to avoid scrolling conflicts)
            if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > minSwipeDistance) {
                if (deltaX > 0) {
                    // Swipe right - go to next page
                    navigateToNextPage();
                } else {
                    // Swipe left - go to previous page
                    navigateToPreviousPage();
                }
            }
        }

        function navigateToNextPage() {
            if (currentPage && currentPage < 604) {
                loadPage(currentPage + 1);
            }
        }

        function navigateToPreviousPage() {
            if (currentPage && currentPage > 1) {
                loadPage(currentPage - 1);
            }
        }

        window.onclick = function(event) {
            const modal = document.getElementById('modal');
            if (event.target === modal) {
                modal.style.display = 'none';
                document.body.classList.remove('modal-open');
                document.documentElement.classList.remove('modal-open');
            }
        }

        // Initialize dark mode from localStorage
        function initializeDarkMode() {
            if (localStorage.getItem('night') === 'true') {
                document.body.classList.add('dark');
            } else {
                document.body.classList.remove('dark');
            }
        }

        // Initialize dark mode immediately (before page renders)
        initializeDarkMode();

        // Listen for storage changes (when settings are updated in another tab/window)
        window.addEventListener('storage', (e) => {
            if (e.key === 'night') {
                initializeDarkMode();
            }
        });

        window.onload = async () => {
            // Load Quran text and tajweed data on page load
            await Promise.all([
                loadQuranText(),
                loadTajweedData()
            ]);
            createCalendar();
            // Re-check dark mode on load
            initializeDarkMode();
            
            // Add touch event listeners for swipe navigation
            const modalContent = document.querySelector('.modal-content');
            if (modalContent) {
                modalContent.addEventListener('touchstart', handleTouchStart, { passive: true });
                modalContent.addEventListener('touchend', handleTouchEnd, { passive: true });
            }
        }
    </script>
</body>
</html>
