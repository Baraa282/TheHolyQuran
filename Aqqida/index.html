<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>العَقِيدَة</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #F5F1E8;
      font-family: "Amiri", "Traditional Arabic", serif;
      touch-action: pan-y pinch-zoom;
    }

    .viewer {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide-track {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 16px 80px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    .slide img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .navbar-back {
      position: fixed;
      top: 16px;
      left: 16px;
      right: auto;
      background: #889b61;
      border: 1px solid rgba(0,0,0,0.1);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 12px;
      z-index: 20;
      text-decoration: none;
      color: #fff;
    }
    .navbar-back:hover { background: #6B7A4A; color: #fff; }
    .navbar-back svg { width: 22px; height: 22px; }

    .counter {
      position: fixed;
      top: 20px;
      right: 20px;
      left: auto;
      color: #333;
      font-size: 1rem;
      z-index: 20;
    }

  </style>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <a href="../section.html" class="navbar-back" title="Back" aria-label="Back">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
  </a>

  <span class="counter" id="counter">1 / 50</span>

  <div class="viewer">
    <div class="slide-track" id="track"></div>
  </div>

  <script>
    (function () {
      const total = 50;
      let current = 0;
      let startX = 0, startY = 0, moved = false;
      const minSwipe = 50;

      const track = document.getElementById('track');
      for (let i = 1; i <= total; i++) {
        const div = document.createElement('div');
        div.className = 'slide' + (i === 1 ? ' active' : '');
        div.setAttribute('data-index', i - 1);
        div.innerHTML = '<img src="' + i + '.jpg" alt="' + i + '">';
        track.appendChild(div);
      }

      const slides = document.querySelectorAll('.slide');
      const counterEl = document.getElementById('counter');

      function goTo(index) {
        index = Math.max(0, Math.min(total - 1, index));
        current = index;
        slides.forEach((s, i) => s.classList.toggle('active', i === current));
        counterEl.textContent = (current + 1) + ' / ' + total;
      }

      function next() { goTo(current + 1); }
      function prev() { goTo(current - 1); }

      // Touch swipe
      document.getElementById('track').addEventListener('touchstart', function (e) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        moved = false;
      }, { passive: true });

      document.getElementById('track').addEventListener('touchmove', function (e) {
        moved = true;
      }, { passive: true });

      document.getElementById('track').addEventListener('touchend', function (e) {
        if (!moved) return;
        const endX = e.changedTouches[0].clientX;
        const endY = e.changedTouches[0].clientY;
        const dx = endX - startX;
        const dy = endY - startY;
        if (Math.abs(dx) < minSwipe || Math.abs(dy) > Math.abs(dx)) return;
        if (dx > 0) next();
        else prev();
      }, { passive: true });

      // Mouse drag (desktop)
      document.getElementById('track').addEventListener('mousedown', function (e) {
        startX = e.clientX;
        startY = e.clientY;
        moved = false;
      });

      document.getElementById('track').addEventListener('mousemove', function (e) {
        if (e.buttons === 1) moved = true;
      });

      document.getElementById('track').addEventListener('mouseup', function (e) {
        if (!moved) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (Math.abs(dx) < minSwipe || Math.abs(dy) > Math.abs(dx)) return;
        if (dx > 0) next();
        else prev();
      });

      goTo(0);

      // Fallback: if .jpg fails, try .png
      document.querySelectorAll('.slide img').forEach(function (img) {
        img.addEventListener('error', function () {
          var src = this.getAttribute('src') || '';
          if (src.endsWith('.jpg')) this.src = src.replace(/\.jpg$/, '.png');
        });
      });
    })();
  </script>
</body>
</html>
