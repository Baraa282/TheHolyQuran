                if (!this.pageData || !this.quranText) return [];

                const pageIndex = pageNumber - 1;
                if (pageIndex < 0 || pageIndex >= this.pageData.length) {
                    return [];
                }

                const pageInfo = this.pageData[pageIndex];
                if (!pageInfo || !Array.isArray(pageInfo)) {
                    return [];
                }

                const verses = [];
                const isObjectFormat = !Array.isArray(this.quranText);

                pageInfo.forEach(surahInfo => {
                    const surahNum = surahInfo.surah;
                    const startAyah = surahInfo.start;
                    const endAyah = surahInfo.end;

                    for (let ayahNum = startAyah; ayahNum <= endAyah; ayahNum++) {
                        let verse = null;

                        if (isObjectFormat) {
                            const verseKey = `${surahNum}:${ayahNum}`;
                            verse = this.quranText[verseKey];
                            if (verse) {
                                verses.push({
                                    ...verse,
                                    surah: verse.surah,
                                    ayah: verse.ayah
                                });
                            }
                        } else {
                            verse = this.quranText.find(v =>
                                v.surah_number === surahNum && v.verse_number === ayahNum
                            );
                            if (verse) {
                                verses.push({
                                    ...verse,
                                    surah: surahNum,
                                    ayah: ayahNum
                                });
                            }
                        }
                    }
                });

                return verses;
            }

            // Fallback method to get verses when pageData is not available
            // This uses a simple approximation: ~15 verses per page
            getVersesForPageFallback(pageNumber) {
                if (!this.quranText || Array.isArray(this.quranText)) {
                    console.log('Fallback: quranText not available or wrong format');
                    return [];
                }

                const versesPerPage = 15; // Approximate verses per page
                const startVerseIndex = (pageNumber - 1) * versesPerPage;
                const endVerseIndex = startVerseIndex + versesPerPage;

                // Sort verse keys properly: first by surah, then by ayah
                const allVerseKeys = Object.keys(this.quranText).sort((a, b) => {
                    const [s1, a1] = a.split(':').map(Number);
                    const [s2, a2] = b.split(':').map(Number);
                    if (s1 !== s2) {
                        return s1 - s2;
                    }
                    return a1 - a2;
                });

                console.log(`Fallback: Total verses: ${allVerseKeys.length}, Page ${pageNumber}: verses ${startVerseIndex} to ${endVerseIndex}`);

                const pageKeys = allVerseKeys.slice(startVerseIndex, endVerseIndex);
                const verses = pageKeys.map(key => {
                    const verse = this.quranText[key];
                    if (!verse) {
                        console.warn(`Fallback: Verse ${key} not found`);
                        return null;
                    }
                    return {
                        ...verse,
                        surah: verse.surah,
                        ayah: verse.ayah
                    };
                }).filter(v => v !== null);

                console.log(`Fallback: Returning ${verses.length} verses for page ${pageNumber}`);
                return verses;
            }

            renderPageText(pageNumber) {
                if (!this.pageTextContent) return;

                // Use qpc-hafs.json data
                let verses = [];

                if (!this.quranText) {
                    console.log('quranText not loaded yet, showing loading message');
                    this.pageTextContent.innerHTML = '<div style="text-align: center; padding: 50px; font-family: UthmanicHafs_v2-0, serif;">جاري التحميل...</div>';
                    return;
                }

                // Check if it's object format (qpc-hafs.json) or array format (old)
                const isObjectFormat = !Array.isArray(this.quranText);

                if (isObjectFormat) {
                    // Try to get verses using pageData first
                    verses = this.getVersesForPage(pageNumber);

                    // Fallback: if no verses found and no pageData, use fallback method
                    if (verses.length === 0 && !this.pageData) {
                        console.warn('No pageData available, using fallback to get verses');
                        verses = this.getVersesForPageFallback(pageNumber);
                    }
                } else if (this.quranText.length > 0) {
                    verses = this.getVersesForPage(pageNumber);
                }

                console.log(`Page ${pageNumber}: Found ${verses.length} verses`, verses.length > 0 ? verses.slice(0, 2) : 'none');

                if (!verses || verses.length === 0) {
                    this.pageTextContent.innerHTML = '<div style="text-align: center; padding: 50px; font-family: UthmanicHafs_v2-0, serif;">جاري التحميل...</div>';
                    return;
                }

                let html = '';
                let currentSurah = 0;

                // Start first line
                html += '<div class="mushaf-line">';

                verses.forEach((verse, index) => {
                    // qpc-hafs.json data structure: {surah, ayah, text, verse_key, id}
                    // Old format: {surah_number, verse_number, content}
                    const surahNum = verse.surah || verse.surah_number;
                    const ayahNum = verse.ayah || verse.verse_number;
                    const verseKey = verse.verse_key || `${surahNum}:${ayahNum}`;

                    // Try to get verse text with tajweed rules, fallback to regular text
                    let verseText = null;
                    if (this.tajweedData) {
                        verseText = this.getVerseTextWithTajweed(surahNum, ayahNum);
                    }
                    if (!verseText) {
                        verseText = verse.text || verse.content; // Arabic text content without tajweed
                    }

                    // Show surah header if new surah starts
                    if (surahNum !== currentSurah) {
                        if (currentSurah !== 0) {
                            html += '</div>'; // Close previous surah section
                            html += '<div class="mushaf-line">'; // Start new line for new surah
                        }

                        currentSurah = surahNum;

                        // Get surah name - use QuranData.Sura first, then fallback
                        let surahName;
                        if (window.QuranData && QuranData.Sura && QuranData.Sura[surahNum] && Array.isArray(QuranData.Sura[surahNum]) && QuranData.Sura[surahNum][4]) {
                            // QuranData.Sura structure: [start, ayas, order, rukus, name_ar, tname, ename, type]
                            surahName = QuranData.Sura[surahNum][4];
                            if (typeof surahName === 'string') {
                                // Add "سورة" prefix if not present
                                if (!surahName.startsWith('سورة')) {
                                    surahName = `سورة ${surahName}`;
                                }
                            } else {
                                surahName = `سورة ${surahNum}`;
                            }
                        } else if (this.surahData && this.surahData[surahNum - 1] && this.surahData[surahNum - 1].name_ar) {
                            // Fallback to surahData
                            surahName = this.surahData[surahNum - 1].name_ar;
                            if (typeof surahName === 'string' && !surahName.startsWith('سورة')) {
                                surahName = `سورة ${surahName}`;
                            } else if (typeof surahName !== 'string') {
                                surahName = `سورة ${surahNum}`;
                            }
                        } else {
                            // Final fallback: use surah number
                            surahName = `سورة ${surahNum}`;
                        }

                        html += `<div class="surah-section">`;

                        // Show surah name only if surah starts on this page (ayah 1)
                        if (ayahNum === 1) {
                            const surahNameEsc = surahName.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                            const headerChar = (typeof SURAH_HEADER_LIGATURES !== 'undefined' && SURAH_HEADER_LIGATURES[surahNum - 1]) ? SURAH_HEADER_LIGATURES[surahNum - 1] : surahName;
                            const bismillahPart = (surahNum !== 1 && surahNum !== 9) ? (() => {
                                const bismillahChar = (this.ligatures && this.ligatures.bismillah) ? this.ligatures.bismillah : '\uFDFD';
                                const bismillahEsc = bismillahChar.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                                return `<div class="bismillah" aria-label="بسم الله الرحمن الرحيم">${bismillahEsc}</div>`;
                            })() : '';
                            html += `<div class="surah-header">
                                <span class="surah-header-name" title="${surahNameEsc}" aria-label="${surahNameEsc}">${headerChar}</span>
                                ${bismillahPart}
                            </div>`;
                        }
                    }

                    // Render verse text from qpc-hafs.json or qpc-hafs-tajweed.json
                    // If tajweed data is used, verseText contains HTML with tajweed rules
                    // Escape HTML if it's plain text, but allow HTML if it's from tajweed
                    const isTajweedText = this.tajweedData && this.getWordsForVerse(surahNum, ayahNum);
                    if (isTajweedText) {
                        // Tajweed text contains HTML tags - insert as-is (ayah symbol already styled)
                        html += `<span class="ayah-text" data-surah="${surahNum}" data-ayah="${ayahNum}" data-key="${verseKey}">${verseText}</span>`;
                    } else {
                        // Plain text - extract and style ayah end symbol, then escape HTML
                        const { text: textWithoutSymbol, symbol } = this.extractAyahEndSymbol(verseText);
                        // Escape HTML in the text part
                        const escapedText = textWithoutSymbol.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                        // Add styled ayah end symbol
                        const finalText = symbol ? `${escapedText} <span class="ayah-end-symbol">${symbol}</span>` : escapedText;
                        html += `<span class="ayah-text" data-surah="${surahNum}" data-ayah="${ayahNum}" data-key="${verseKey}">${finalText}</span>`;
                    }

                    // Add translation if enabled
                    if (this.showTranslation) {
                        const translation = this.getTranslation(surahNum, ayahNum);
                        if (translation) {
                            html += `<div class="ayah-translation">${translation}</div>`;
                        }
                    }
                });

                // Close last line
                html += '</div>';

                if (currentSurah !== 0) {
                    html += '</div>'; // Close last surah section
                }

                this.pageTextContent.innerHTML = html;

                // Add click handler for verses (tap = play audio)
                this.pageTextContent.querySelectorAll('.ayah-text').forEach(element => {
                    element.addEventListener('click', (e) => {
                        const surah = parseInt(element.dataset.surah);
                        const ayah = parseInt(element.dataset.ayah);
                        element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        this.playAyahAudio(surah, ayah);
                    });
                });
            }

            toggleFocusMode() {
                const inFocus = document.body.classList.toggle('focus-mode');
                if (inFocus) {
                    this._focusModeExitHandler = (e) => {
                        const t = e.target;
                        if (t.closest('.ayah-text') || t.closest('button') || t.closest('a')) return;
                        document.body.classList.remove('focus-mode');
                        this.pageContainer.removeEventListener('click', this._focusModeExitHandler);
                        this._focusModeExitHandler = null;
                    };
                    this.pageContainer.addEventListener('click', this._focusModeExitHandler);
                } else {
                    if (this._focusModeExitHandler) {
                        this.pageContainer.removeEventListener('click', this._focusModeExitHandler);
                        this._focusModeExitHandler = null;
                    }
                }
            }

            copyVerseToClipboard(surah, ayah, verseText) {
                const { englishName } = this.getSurahDisplayName(surah);
                const line = `${verseText} — ${englishName} ${surah}:${ayah}`;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    return navigator.clipboard.writeText(line).then(() => true).catch(() => false);
                }
                const ta = document.createElement('textarea');
                ta.value = line;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    return Promise.resolve(true);
                } catch (e) {
                    return Promise.resolve(false);
                } finally {
                    document.body.removeChild(ta);
                }
            }

            createAyahOverlays() {
                // Clear existing overlays
                this.ayahOverlayContainer.innerHTML = '';
                this.ayahOverlays = {}; // Reset overlay references
                this.clearHighlights(); // Clear any existing highlights

                // Find page data from array
                if (!this.ayahPositions || !Array.isArray(this.ayahPositions)) {
                    return;
                }

                const pageData = this.ayahPositions.find(p => p.page === this.currentPage);
                if (!pageData) {
                    return;
                }

                // Get surah number for current page
                const surahNumber = pageData.surah || this.getSurahForPage(this.currentPage);

                // Wait for image to be fully rendered
                setTimeout(() => {
                    const imgRect = this.pageImage.getBoundingClientRect();
                    const containerRect = this.pageContainer.getBoundingClientRect();

                    // Get actual image dimensions
                    const img = this.pageImage;
                    const naturalWidth = img.naturalWidth || img.width;
                    const naturalHeight = img.naturalHeight || img.height;

                    // Reference image dimensions (from the JSON coordinates)
                    // Assuming the JSON coordinates are based on the original image size
                    const refWidth = naturalWidth;
                    const refHeight = naturalHeight;

                    // Calculate scale factors based on displayed size vs natural size
                    const scaleX = imgRect.width / refWidth;
                    const scaleY = imgRect.height / refHeight;

                    // Calculate offset (image is centered in container)
                    const offsetX = imgRect.left - containerRect.left;
                    const offsetY = imgRect.top - containerRect.top;

                    // Create overlays for each ayah
                    pageData.ayahs.forEach(ayah => {
                        const overlayKey = `${surahNumber}:${ayah.aya}`;
                        if (!this.ayahOverlays[overlayKey]) {
                            this.ayahOverlays[overlayKey] = [];
                        }

                        ayah.parts.forEach((part, partIndex) => {
                            const overlay = document.createElement('div');
                            overlay.className = 'ayah-highlight';

                            // Scale and position the overlay
                            overlay.style.left = `${offsetX + part.x * scaleX}px`;
                            overlay.style.top = `${offsetY + part.y * scaleY}px`;
                            overlay.style.width = `${part.w * scaleX}px`;
                            overlay.style.height = `${part.h * scaleY}px`;

                            // Store overlay reference
                            this.ayahOverlays[overlayKey].push(overlay);

                            // Function to play audio
                            const playAudio = () => {
                                this.playAyahAudio(surahNumber, ayah.aya);
                            };

                            // Add click handler for desktop
                            overlay.addEventListener('click', playAudio);

                            // Add touch handlers for mobile
                            let touchStartTime = 0;
                            let touchStartY = 0;

                            overlay.addEventListener('touchstart', (e) => {
                                touchStartTime = Date.now();
                                touchStartY = e.touches[0].clientY;
                                // Prevent swipe navigation when touching an ayah
                                e.stopPropagation();
                                // Immediately highlight on touch for better mobile feedback
                                this.highlightAyah(surahNumber, ayah.aya);
                            }, { passive: true });

                            overlay.addEventListener('touchend', (e) => {
                                const touchEndTime = Date.now();
                                const touchDuration = touchEndTime - touchStartTime;
                                const touchEndY = e.changedTouches[0].clientY;
                                const verticalMovement = Math.abs(touchEndY - touchStartY);

                                // Only play audio if it was a quick tap (not a swipe)
                                // and vertical movement is minimal (to distinguish from scroll)
                                if (touchDuration < 300 && verticalMovement < 10) {
                                    e.preventDefault();
                                    e.stopPropagation();
                                    playAudio();
                                }
                            }, { passive: false });

                            this.ayahOverlayContainer.appendChild(overlay);
                        });
                    });
                }, 100);
            }

            clearHighlights() {
                // Remove active class from all currently highlighted overlays
                this.currentHighlightedOverlays.forEach(overlay => {
                    overlay.classList.remove('active');
                });
                this.currentHighlightedOverlays = [];

                // Also clear all text highlights
                if (this.pageTextContent) {
                    this.pageTextContent.querySelectorAll('.ayah-text.active').forEach(el => {
                        el.classList.remove('active');
                    });
                }
            }

            scrollToAyah(surahNumber, ayahNumber) {
                // Find the ayah element in the current page using data-key or data attributes
                const overlayKey = `${surahNumber}:${ayahNumber}`;
                const ayahElement = this.pageTextContent?.querySelector(
                    `.ayah-text[data-key="${overlayKey}"], .ayah-text[data-surah="${surahNumber}"][data-ayah="${ayahNumber}"]`
                );

                if (ayahElement) {
                    // Scroll to the ayah
                    ayahElement.scrollIntoView({ behavior: 'smooth', block: 'center' });

                    // Highlight the ayah
                    setTimeout(() => {
                        this.highlightAyah(surahNumber, ayahNumber);
                    }, 300);
                } else {
                    // If ayah not found on current page, try to highlight via overlay
                    setTimeout(() => {
                        this.highlightAyah(surahNumber, ayahNumber);
                    }, 100);
                }
            }

            highlightAyah(surahNumber, ayahNumber) {
                // Clear previous highlights
                this.clearHighlights();

                // Persist last ayah selection
                this.lastSurah = surahNumber;
                this.lastAyah = ayahNumber;
                localStorage.setItem('lastSurah', String(surahNumber));
                localStorage.setItem('lastAyah', String(ayahNumber));

                // Find overlays for this ayah
                const overlayKey = `${surahNumber}:${ayahNumber}`;
                const overlays = this.ayahOverlays[overlayKey];

                if (overlays && overlays.length > 0) {
                    // Add active class to all parts of this ayah
                    overlays.forEach(overlay => {
                        overlay.classList.add('active');
                        this.currentHighlightedOverlays.push(overlay);
                    });
                }

                // Also highlight text element
                const textElement = this.pageTextContent?.querySelector(`[data-key="${overlayKey}"]`);
                if (textElement) {
                    textElement.classList.add('active');
                    this.currentHighlightedOverlays.push(textElement);
                    // Scroll to verse if needed - use setTimeout to ensure DOM is ready
                    setTimeout(() => {
                        textElement.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
                    }, 10);
                }
            }

            // Get the next ayah after the given surah and ayah
            getNextAyah(surahNumber, ayahNumber) {
                let nextSurah = surahNumber;
                let nextAyah = ayahNumber + 1;

                // Check if we've reached the end of the current surah
                if (QuranData.Sura && QuranData.Sura[surahNumber]) {
                    const suraInfo = QuranData.Sura[surahNumber];
                    const maxAyahs = suraInfo[1]; // Number of ayas in this surah

                    if (nextAyah > maxAyahs) {
                        // Move to next surah
                        if (surahNumber < 114) {
                            nextSurah = surahNumber + 1;
                            nextAyah = 1;
                        } else {
                            // End of Quran
                            return null;
                        }
                    }
                } else {
                    // Fallback: check if next verse exists in quranText
                    const nextVerseKey = `${nextSurah}:${nextAyah}`;
                    if (this.quranText && !this.quranText[nextVerseKey]) {
                        // No more verses in this surah, move to next
                        if (surahNumber < 114) {
                            nextSurah = surahNumber + 1;
                            nextAyah = 1;
                        } else {
                            // End of Quran
                            return null;
                        }
                    }
                }

                return { surah: nextSurah, ayah: nextAyah };
            }

            playAyahAudio(surahNumber, ayahNumber) {
                // Check if the same ayah is already playing - if so, stop it
                if (this.currentAudio &&
                    this.currentPlayingSurah === surahNumber &&
                    this.currentPlayingAyah === ayahNumber &&
                    !this.currentAudio.paused) {
                    this.currentAudio.pause();
                    this.currentAudio = null;
                    this.currentPlayingSurah = null;
                    this.currentPlayingAyah = null;
                    this.clearHighlights(); // Clear highlight when stopping
                    this.updatePlayPauseIcon(false);
                    return;
                }

                // Stop any currently playing audio
                if (this.currentAudio) {
                    this.currentAudio.pause();
                    this.currentAudio = null;
                    this.updatePlayPauseIcon(false);
                }

                // Highlight the clicked ayah
                this.highlightAyah(surahNumber, ayahNumber);

                // Play audio from EveryAyah.com API - Alafasy recitation
                const audioUrl = `https://everyayah.com/data/Alafasy_128kbps/${String(surahNumber).padStart(3, '0')}${String(ayahNumber).padStart(3, '0')}.mp3`;

                this.currentAudio = new Audio(audioUrl);
                this.currentPlayingSurah = surahNumber;
                this.currentPlayingAyah = ayahNumber;

                // Apply playback speed from settings
                const audioSpeed = parseFloat(localStorage.getItem('audioSpeed')) || 1.0;
                this.currentAudio.playbackRate = audioSpeed;

                // When audio ends, handle based on repeat setting
                this.currentAudio.addEventListener('ended', () => {
                    // Get repeat setting from localStorage
                    const repeatMode = localStorage.getItem('ayahRepeat') || 'continue';

                    if (repeatMode === 'always') {
                        // Repeat the current ayah
                        setTimeout(() => {
                            this.playAyahAudio(surahNumber, ayahNumber);
                        }, 100);
                    } else {
                        // Continue to next ayah (default behavior)
                        const nextAyah = this.getNextAyah(surahNumber, ayahNumber);

                        if (nextAyah) {
                            // Play next ayah automatically
                            setTimeout(() => {
                                this.playAyahAudio(nextAyah.surah, nextAyah.ayah);
                            }, 100); // Small delay for smooth transition
                        } else {
                            // End of Quran - clear everything
                            this.currentPlayingSurah = null;
                            this.currentPlayingAyah = null;
                            this.clearHighlights();
                            this.updatePlayPauseIcon(false);
                        }
                    }
                });

                // Update icon when audio starts playing
                this.currentAudio.addEventListener('play', () => {
                    this.updatePlayPauseIcon(true);
                });

                // Update icon when audio is paused
                this.currentAudio.addEventListener('pause', () => {
                    this.updatePlayPauseIcon(false);
                });

                this.currentAudio.play().catch(error => {
                    console.error('Failed to play audio:', error);
                    this.currentPlayingSurah = null;
                    this.currentPlayingAyah = null;
                    this.clearHighlights(); // Clear highlight on error
                    this.updatePlayPauseIcon(false);
                });
            }

            updateHeader() {
                let surahNum = this.getSurahForPage(this.currentPage);
                const juzNum = this.getJuzForPage(this.currentPage);

                // Ensure surahNum is a valid number
                if (typeof surahNum !== 'number' || isNaN(surahNum) || surahNum < 1 || surahNum > 114) {
                    surahNum = 1; // Default to first surah
                }

                // Persist last visited surah for navigation
                this.lastSurah = surahNum;
                localStorage.setItem('lastSurah', String(surahNum));

                // Get surah name in Arabic
                let surahArabicName;

                if (window.QuranData && QuranData.Sura && QuranData.Sura[surahNum] && Array.isArray(QuranData.Sura[surahNum]) && QuranData.Sura[surahNum][4]) {
                    surahArabicName = QuranData.Sura[surahNum][4];
                    if (typeof surahArabicName === 'string') {
                        if (!surahArabicName.startsWith('سورة')) {
                            surahArabicName = `سورة ${surahArabicName}`;
                        }
                    } else {
                        surahArabicName = `سورة ${surahNum}`;
                    }
                } else if (this.surahData && this.surahData[surahNum - 1] && this.surahData[surahNum - 1].name_ar) {
                    surahArabicName = this.surahData[surahNum - 1].name_ar;
                    if (typeof surahArabicName === 'string') {
                        if (!surahArabicName.startsWith('سورة')) {
                            surahArabicName = `سورة ${surahArabicName}`;
                        }
                    } else {
                        surahArabicName = `سورة ${surahNum}`;
                    }
                } else {
                    surahArabicName = `سورة ${surahNum}`;
                }

                this.surahName.textContent = surahArabicName;

                // Update page number in Eastern Arabic
                this.pageNumberHeader.textContent = this.toEasternArabic(this.currentPage);

                // Update juz number – use quran-common font ligature (juz001, juz002, …) or Eastern Arabic digit only
                const juzKey = `juz-${juzNum}-number`;
                const juzLigature = this.ligatures && this.ligatures[juzKey];
                if (juzLigature) {
                    this.juzNumber.innerHTML = `<span class="juz-ligature" aria-label="الجزء ${this.toEasternArabic(juzNum)}">${juzLigature}</span>`;
                } else {
                    this.juzNumber.textContent = this.toEasternArabic(juzNum);
                }

                // Update page title with surah name(s)
                this.updatePageTitle();

                // Update bookmark icon state
                this.updateHeaderBookmarkIcon();
                this.updateSurahDropdownSelection();
            }

            updatePageTitle() {
                const surahsOnPage = new Set();

                // Method 1: Use QuranData.Page to determine surah range on this page
                if (window.QuranData && QuranData.Page) {
                    const currentPageStart = QuranData.Page[this.currentPage];
                    const nextPageStart = QuranData.Page[this.currentPage + 1];

                    if (currentPageStart && currentPageStart.length >= 2) {
                        const startSurah = currentPageStart[0];
                        const endSurah = nextPageStart ? nextPageStart[0] : startSurah;

                        // Add all surahs from start to end (inclusive of start, exclusive of end)
                        for (let s = startSurah; s < endSurah; s++) {
                            surahsOnPage.add(s);
                        }
                        // Add end surah if next page starts at a different surah
                        if (!nextPageStart || endSurah !== startSurah) {
                            surahsOnPage.add(endSurah);
                        }
                    }
                }

                // Method 2: Get surahs from verses if available (more accurate)
                const verses = this.getVersesForPage(this.currentPage);
                if (verses && verses.length > 0) {
                    surahsOnPage.clear(); // Use verses as source of truth
                    verses.forEach(verse => {
                        const surah = verse.surah || verse.surah_number;
                        if (surah) {
                            surahsOnPage.add(surah);
                        }
                    });
                }

                // Method 3: Fallback to single surah
                if (surahsOnPage.size === 0) {
                    const surahNum = this.getSurahForPage(this.currentPage);
                    surahsOnPage.add(surahNum || 1);
                }

                // Get surah names in Arabic
                const surahNames = [];
                const sortedSurahs = Array.from(surahsOnPage).sort((a, b) => a - b);

                sortedSurahs.forEach(surahNum => {
                    let surahName;
                    if (window.QuranData && QuranData.Sura && QuranData.Sura[surahNum] && Array.isArray(QuranData.Sura[surahNum]) && QuranData.Sura[surahNum][4]) {
                        surahName = QuranData.Sura[surahNum][4];
                        if (typeof surahName === 'string') {
                            // Add "سورة" prefix if not present
                            if (!surahName.startsWith('سورة')) {
                                surahName = `سورة ${surahName}`;
                            }
                        } else {
                            surahName = `سورة ${surahNum}`;
                        }
                    } else if (this.surahData && this.surahData[surahNum - 1] && this.surahData[surahNum - 1].name_ar) {
                        surahName = this.surahData[surahNum - 1].name_ar;
                        if (typeof surahName === 'string' && !surahName.startsWith('سورة')) {
                            surahName = `سورة ${surahName}`;
                        } else if (typeof surahName !== 'string') {
                            surahName = `سورة ${surahNum}`;
                        }
                    } else {
                        surahName = `سورة ${surahNum}`;
                    }
                    surahNames.push(surahName);
                });

                // Update document title with surah names
                if (surahNames.length > 0) {
                    const titleText = surahNames.join(' - ');
                    document.title = `${titleText} - الصفحة ${this.toEasternArabic(this.currentPage)}`;
                    console.log('Page title updated:', document.title);
                } else {
                    // Fallback if no surah names found
                    const surahNum = this.getSurahForPage(this.currentPage);
                    let fallbackName = `سورة ${surahNum}`;
                    if (window.QuranData && QuranData.Sura && QuranData.Sura[surahNum] && Array.isArray(QuranData.Sura[surahNum]) && QuranData.Sura[surahNum][4]) {
                        const name = QuranData.Sura[surahNum][4];
                        if (typeof name === 'string' && !name.startsWith('سورة')) {
                            fallbackName = `سورة ${name}`;
                        } else if (typeof name === 'string') {
                            fallbackName = name;
                        }
                    }
                    document.title = `${fallbackName} - الصفحة ${this.toEasternArabic(this.currentPage)}`;
                    console.log('Page title updated (fallback):', document.title);
                }
            }

            updateHeaderBookmarkIcon() {
                const bookmarkBtn = document.getElementById('headerBookmarkBtn');
                if (bookmarkBtn) {
                    // Check if page is bookmarked
                    const bookmarks = this.getBookmarks();
                    if (bookmarks.includes(this.currentPage)) {
                        bookmarkBtn.classList.add('active');
                    } else {
                        bookmarkBtn.classList.remove('active');
                    }
                }
            }

            getBookmarks() {
                const rawBookmarks = JSON.parse(localStorage.getItem('quranBookmarks') || '[]');
                if (!Array.isArray(rawBookmarks)) return [];
                return rawBookmarks.filter(page =>
                    Number.isInteger(page) && page >= 1 && page <= this.totalPages
                );
            }

            saveBookmarks(bookmarks) {
                localStorage.setItem('quranBookmarks', JSON.stringify(bookmarks));
            }

            getBookmarkTimestamps() {
                const raw = JSON.parse(localStorage.getItem('quranBookmarksTimestamps') || '{}');
                if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return {};

                const timestamps = {};
                Object.keys(raw).forEach((key) => {
                    const page = parseInt(key, 10);
                    const ts = Number(raw[key]);
                    if (Number.isInteger(page) && page >= 1 && page <= this.totalPages && Number.isFinite(ts)) {
                        timestamps[String(page)] = ts;
                    }
                });
                return timestamps;
            }

            saveBookmarkTimestamps(timestamps) {
                localStorage.setItem('quranBookmarksTimestamps', JSON.stringify(timestamps));
            }

            getVerseBookmarks() {
                const raw = JSON.parse(localStorage.getItem('quranVerseBookmarks') || '[]');
                if (!Array.isArray(raw)) return [];
                return raw.filter(v =>
                    v && (v.type === 'verse') && Number.isInteger(v.surah) && Number.isInteger(v.ayah) && v.surah >= 1 && v.surah <= 114 && v.ayah >= 1
                );
            }

            saveVerseBookmarks(verseBookmarks) {
                localStorage.setItem('quranVerseBookmarks', JSON.stringify(verseBookmarks));
            }

            getVerseBookmarkTimestamps() {
                const raw = JSON.parse(localStorage.getItem('quranVerseBookmarksTimestamps') || '{}');
                if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return {};
                const out = {};
                Object.keys(raw).forEach(key => {
                    const ts = Number(raw[key]);
                    if (Number.isFinite(ts)) out[key] = ts;
                });
                return out;
            }

            saveVerseBookmarkTimestamps(timestamps) {
                localStorage.setItem('quranVerseBookmarksTimestamps', JSON.stringify(timestamps));
            }

            isVerseBookmarked(surah, ayah) {
                const key = `${surah}:${ayah}`;
                return this.getVerseBookmarks().some(v => `${v.surah}:${v.ayah}` === key);
            }

            toggleVerseBookmark(surah, ayah) {
                const list = this.getVerseBookmarks();
                const key = `${surah}:${ayah}`;
                const idx = list.findIndex(v => `${v.surah}:${v.ayah}` === key);
                const timestamps = this.getVerseBookmarkTimestamps();
                const page = this.getPageForVerse(surah, ayah);
                if (idx > -1) {
                    list.splice(idx, 1);
                    delete timestamps[key];
                    this.saveVerseBookmarks(list);
                    this.saveVerseBookmarkTimestamps(timestamps);
                    return false;
                }
                list.push({ type: 'verse', surah, ayah, page });
                timestamps[key] = Date.now();
                this.saveVerseBookmarks(list);
                this.saveVerseBookmarkTimestamps(timestamps);
                return true;
            }

            showBookmarkToast(message) {
                const toast = document.getElementById('bookmarkToast');
                if (!toast) return;
                toast.textContent = message;
                toast.classList.add('show');
                clearTimeout(this._bookmarkToastTimer);
                this._bookmarkToastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            }

            toggleBookmark(pageNumber) {
                const bookmarks = this.getBookmarks();
                const timestamps = this.getBookmarkTimestamps();
                const index = bookmarks.indexOf(pageNumber);

                if (index > -1) {
                    bookmarks.splice(index, 1);
                    delete timestamps[String(pageNumber)];
                    this.saveBookmarks(bookmarks);
                    this.saveBookmarkTimestamps(timestamps);
                    return false;
                }

                // Keep newest bookmark first in storage order and timestamp.
                bookmarks.unshift(pageNumber);
                timestamps[String(pageNumber)] = Date.now();
                this.saveBookmarks(bookmarks);
                this.saveBookmarkTimestamps(timestamps);
                return true;
            }

            migrateLegacyBookmarksOrder() {
                const orderVersionKey = 'quranBookmarksOrderVersion';
                if (localStorage.getItem(orderVersionKey) === '3') {
                    return;
                }

                // One-time migration:
                // - ensure unique valid pages
                // - generate recency timestamps for old saved arrays
                let bookmarks = this.getBookmarks();
                bookmarks = bookmarks.filter((page, index, arr) => arr.indexOf(page) === index);
                const timestamps = this.getBookmarkTimestamps();

                const isStrictlyAscending = bookmarks.every((page, i, arr) => i === 0 || arr[i - 1] < page);
                const base = Date.now() - bookmarks.length;
                bookmarks.forEach((page, index) => {
                    const key = String(page);
                    if (!Number.isFinite(Number(timestamps[key]))) {
                        // Legacy numeric sort usually stored ascending page number.
                        // Treat the end of that list as newest.
                        timestamps[key] = isStrictlyAscending
                            ? base + index
                            : base + (bookmarks.length - index);
                    }
                });

                this.saveBookmarks(bookmarks);
                this.saveBookmarkTimestamps(timestamps);
                localStorage.setItem(orderVersionKey, '3');
            }

            getOrderedBookmarks() {
                const bookmarks = this.getBookmarks();
                const timestamps = this.getBookmarkTimestamps();

                return [...bookmarks].sort((a, b) => {
                    const tsA = Number(timestamps[String(a)] || 0);
                    const tsB = Number(timestamps[String(b)] || 0);
                    if (tsA !== tsB) return tsB - tsA; // Newest first
                    return bookmarks.indexOf(a) - bookmarks.indexOf(b);
                });
            }

            getSurahDisplayName(surahNum) {
                let englishName = `Surah ${surahNum}`;
                let arabicName = `سورة ${surahNum}`;
                if (window.QuranData && QuranData.Sura && QuranData.Sura[surahNum] && Array.isArray(QuranData.Sura[surahNum])) {
                    if (QuranData.Sura[surahNum][6]) englishName = QuranData.Sura[surahNum][6];
                    if (QuranData.Sura[surahNum][4]) {
                        arabicName = QuranData.Sura[surahNum][4];
                        if (typeof arabicName === 'string' && !arabicName.startsWith('سورة')) arabicName = `سورة ${arabicName}`;
                    }
                } else if (this.surahData && this.surahData[surahNum - 1]) {
                    if (this.surahData[surahNum - 1].name_en) englishName = this.surahData[surahNum - 1].name_en;
                    if (this.surahData[surahNum - 1].name_ar) {
                        arabicName = this.surahData[surahNum - 1].name_ar;
                        if (typeof arabicName === 'string' && !arabicName.startsWith('سورة')) arabicName = `سورة ${arabicName}`;
                    }
                }
                return { englishName, arabicName };
            }

            getOrderedBookmarkItems() {
                const pageBookmarks = this.getOrderedBookmarks();
                const pageTs = this.getBookmarkTimestamps();
                const verseBookmarks = this.getVerseBookmarks();
                const verseTs = this.getVerseBookmarkTimestamps();
                const items = [];
                pageBookmarks.forEach(pageNum => {
                    items.push({ type: 'page', page: pageNum, ts: Number(pageTs[String(pageNum)] || 0) });
                });
                verseBookmarks.forEach(v => {
                    const key = `${v.surah}:${v.ayah}`;
                    items.push({ type: 'verse', surah: v.surah, ayah: v.ayah, page: v.page, ts: Number(verseTs[key] || 0) });
                });
                return items.sort((a, b) => b.ts - a.ts);
            }

            renderBookmarks() {
                const bookmarkList = document.getElementById('bookmarkList');
                if (!bookmarkList) return;

                const items = this.getOrderedBookmarkItems();

                if (items.length === 0) {
                    bookmarkList.innerHTML = '<div class="bookmark-empty">No bookmarks yet. Use the bookmark button to save a page.</div>';
                    return;
                }

                bookmarkList.innerHTML = items.map(item => {
                    if (item.type === 'page') {
                        const { englishName, arabicName } = this.getSurahDisplayName(this.getSurahForPage(item.page));
                        const surahName = `${englishName} (${arabicName})`;
                        const pageLabel = `Page ${item.page} (صفحة ${this.toEasternArabic(item.page)})`;
                        return `
                            <div class="bookmark-item" data-type="page" data-page="${item.page}">
                                <div class="bookmark-item-info">
                                    <div class="bookmark-item-name">${surahName}</div>
                                    <div class="bookmark-item-page">${pageLabel}</div>
                                </div>
                                <button class="bookmark-item-remove" data-type="page" data-page="${item.page}">&times;</button>
                            </div>`;
                    } else {
                        const { englishName, arabicName } = this.getSurahDisplayName(item.surah);
                        const surahName = `${englishName} (${arabicName})`;
                        const versePageLabel = `Verse ${item.ayah} (آية ${this.toEasternArabic(item.ayah)}) · Page ${item.page} (صفحة ${this.toEasternArabic(item.page)})`;
                        return `
                            <div class="bookmark-item bookmark-item-verse" data-type="verse" data-surah="${item.surah}" data-ayah="${item.ayah}" data-page="${item.page}">
                                <div class="bookmark-item-info">
                                    <div class="bookmark-item-name">${surahName}</div>
                                    <div class="bookmark-item-page">${versePageLabel}</div>
                                </div>
                                <button class="bookmark-item-remove" data-type="verse" data-surah="${item.surah}" data-ayah="${item.ayah}">&times;</button>
                            </div>`;
                    }
                }).join('');

                bookmarkList.querySelectorAll('.bookmark-item').forEach(item => {
                    const type = item.dataset.type;
                    if (type === 'page') {
                        const pageNum = parseInt(item.dataset.page);
                        item.addEventListener('click', (e) => {
                            if (!e.target.classList.contains('bookmark-item-remove')) {
                                this.loadPage(pageNum);
                                this.closeBookmarkModal();
                            }
                        });
                    } else {
                        const surah = parseInt(item.dataset.surah);
                        const ayah = parseInt(item.dataset.ayah);
                        item.addEventListener('click', (e) => {
                            if (!e.target.classList.contains('bookmark-item-remove')) {
                                this.findAndGoToAyah(surah, ayah);
                                this.closeBookmarkModal();
                            }
                        });
                    }
                });

                bookmarkList.querySelectorAll('.bookmark-item-remove').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const type = btn.dataset.type;
                        if (type === 'page') {
                            const pageNum = parseInt(btn.dataset.page);
                            const bookmarks = this.getBookmarks();
                            const timestamps = this.getBookmarkTimestamps();
                            const index = bookmarks.indexOf(pageNum);
                            if (index > -1) {
                                bookmarks.splice(index, 1);
                                delete timestamps[String(pageNum)];
                                this.saveBookmarks(bookmarks);
                                this.saveBookmarkTimestamps(timestamps);
                                this.renderBookmarks();
                                this.updateHeaderBookmarkIcon();
                            }
                        } else {
                            const surah = parseInt(btn.dataset.surah);
                            const ayah = parseInt(btn.dataset.ayah);
                            this.toggleVerseBookmark(surah, ayah);
                            this.renderBookmarks();
                        }
                    });
                });
            }

            openBookmarkModal() {
                const bookmarkPage = document.getElementById('bookmarkPage');
                const container = document.querySelector('.container');
                const bookmarkList = document.getElementById('bookmarkList');
                if (bookmarkPage) {
                    this.renderBookmarks();
                    if (bookmarkList) {
                        // Always show the first bookmark at the top when opening
                        bookmarkList.scrollTop = 0;
                    }
                    bookmarkPage.classList.add('active');
                    if (container) {
                        container.style.display = 'none';
                    }
                }
            }

            closeBookmarkModal() {
                const bookmarkPage = document.getElementById('bookmarkPage');
                const container = document.querySelector('.container');
                if (bookmarkPage) {
                    bookmarkPage.classList.remove('active');
                    if (container) {
                        container.style.display = 'flex';
                    }
                }
            }

            async init() {
                // Load Quran text and page data
                await Promise.all([
                    this.loadQuranText(), // Load qpc-hafs.json first
                    this.loadTajweedData(), // Load qpc-hafs-tajweed.json
                    this.loadPageData(),
                    this.loadSurahData(),
                    this.loadLigaturesData(), // styles/ligatures.json
                    this.loadAyahPositions(),
                    this.loadUthmanicData(), // Load qpc-hafs.json
                    this.loadTranslationData() // Load translation data
                ]);

                this.migrateLegacyBookmarksOrder();
                this.populateSurahDropdown();

                // Check for URL parameters (from search results)
                const urlParams = new URLSearchParams(window.location.search);
                const pageParam = urlParams.get('page');
                const surahParam = urlParams.get('surah');
                const ayahParam = urlParams.get('ayah');
                const hasNavigationParams = Boolean(pageParam || (surahParam && ayahParam));

                // Prioritize surah and ayah for page determination if present
                let calculatedPage = null;
                if (surahParam && ayahParam) {
                    const surah = parseInt(surahParam);
                    const ayah = parseInt(ayahParam);
                    // Find page for this ayah
                    if (window.QuranData && QuranData.Page) {
                        for (let p = 1; p <= 604; p++) {
                            const pageStart = QuranData.Page[p];
                            if (pageStart && pageStart.length >= 2) {
                                const pageSurah = pageStart[0];
                                const pageAyah = pageStart[1];

                                // Check if this page starts at or before our target ayah
                                if (pageSurah < surah || (pageSurah === surah && pageAyah <= ayah)) {
                                    // Check next page
                                    const nextPageStart = QuranData.Page[p + 1];
                                    if (!nextPageStart || !Array.isArray(nextPageStart) || nextPageStart.length < 2) {
                                        calculatedPage = p;
                                        break;
                                    }
                                    const nextSurah = nextPageStart[0];
                                    const nextAyah = nextPageStart[1];

                                    if (nextSurah > surah || (nextSurah === surah && nextAyah > ayah)) {
                                        calculatedPage = p;
                                        break;
                                    }
                                }
                            }
                        }
                    }
                }

                if (calculatedPage) {
                    this.currentPage = calculatedPage;
                } else if (pageParam) {
                    const page = parseInt(pageParam);
                    if (page >= 1 && page <= 604) {
                        this.currentPage = page;
                    }
                } else {
                    // Restore last visited page if available
                    const lastPage = localStorage.getItem('lastPage');
                    if (lastPage) {
                        const page = parseInt(lastPage);
                        if (page >= 1 && page <= 604) {
                            this.currentPage = page;
                        }
                    }
                }

                this.loadPage(this.currentPage);

                // If surah and ayah are specified, scroll to and highlight after page loads
                if (surahParam && ayahParam) {
                    const surah = parseInt(surahParam);
                    const ayah = parseInt(ayahParam);

                    // Wait for page to fully render, then scroll to ayah
                    // Use multiple attempts with increasing delays to ensure page is ready
                    let attempts = 0;
                    const maxAttempts = 8;
                    const checkAndScroll = () => {
                        attempts++;
                        const ayahElement = this.pageTextContent?.querySelector(
                            `.ayah-text[data-key="${surah}:${ayah}"], .ayah-text[data-surah="${surah}"][data-ayah="${ayah}"]`
                        );

                        if (ayahElement) {
                            // Found the ayah, scroll to it
                            this.scrollToAyah(surah, ayah);
                        } else if (attempts >= maxAttempts) {
                            // After max attempts, if still not found, try to find the correct page
                            console.warn(`Ayah ${surah}:${ayah} not found on page ${this.currentPage}, trying to find correct page`);
                            this.findAndGoToAyah(surah, ayah);
                        } else {
                            // Retry after a short delay
                            setTimeout(checkAndScroll, 250);
                        }
                    };

                    // Start checking after initial render delay
                    setTimeout(checkAndScroll, 400);
                }

                // If page param was provided, also persist it so navBook can reuse it
                if (pageParam) {
                    localStorage.setItem('lastPage', String(this.currentPage));
                }

                // Clear one-time navigation query params so future app opens use the true last page
                if (hasNavigationParams && window.history && typeof window.history.replaceState === 'function') {
                    window.history.replaceState({}, document.title, window.location.pathname);
                }

                // Persist the current page when app goes to background or closes
                const persistCurrentPage = () => {
                    if (this.currentPage >= 1 && this.currentPage <= this.totalPages) {
                        localStorage.setItem('lastPage', String(this.currentPage));
                    }
                };
                window.addEventListener('pagehide', persistCurrentPage);
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'hidden') {
                        persistCurrentPage();
                    }
                });

                // Apply font size from settings
                this.applyFontSize();

                // Listen for storage changes (when settings are updated in another tab/window)
                window.addEventListener('storage', (e) => {
                    if (e.key === 'fontSize') {
                        this.applyFontSize();
                    }
                });

                // Listen for custom event (when settings are updated in same window)
                window.addEventListener('fontSizeChanged', () => {
                    this.applyFontSize();
                });

                // Also check on window focus (in case settings were changed)
                window.addEventListener('focus', () => {
                    this.applyFontSize();
                });

                // Surah name click to show dropdown
                this.surahName.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (this.pageDropdown) this.pageDropdown.classList.remove('active');
                    if (this.juzDropdown) this.juzDropdown.classList.remove('active');
                    this.surahDropdown.classList.toggle('active');
                    if (this.surahDropdown.classList.contains('active')) {
                        const selectedItem = this.updateSurahDropdownSelection();
                        if (selectedItem) {
                            selectedItem.scrollIntoView({ block: 'center', behavior: 'smooth' });
                        }
                    }
                });

                // Close dropdown when clicking outside
                document.addEventListener('click', (e) => {
                    if (!this.surahName.contains(e.target) && !this.surahDropdown.contains(e.target)) {
                        this.surahDropdown.classList.remove('active');
                    }
                    if (this.pageNumberHeader && !this.pageNumberHeader.contains(e.target) && this.pageDropdown && !this.pageDropdown.contains(e.target)) {
                        this.pageDropdown.classList.remove('active');
                    }
                    if (this.juzNumber && !this.juzNumber.contains(e.target) && this.juzDropdown && !this.juzDropdown.contains(e.target)) {
                        this.juzDropdown.classList.remove('active');
                    }
                });

                // Page number click to show page list for current surah
                if (this.pageNumberHeader && this.pageDropdown) {
                    this.pageNumberHeader.addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.surahDropdown.classList.remove('active');
                        if (this.juzDropdown) this.juzDropdown.classList.remove('active');
                        this.populatePageDropdown();
                        this.pageDropdown.classList.toggle('active');
                    });
                }
                if (this.juzNumber && this.juzDropdown) {
                    this.juzNumber.addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.surahDropdown.classList.remove('active');
                        if (this.pageDropdown) this.pageDropdown.classList.remove('active');
                        this.populateJuzDropdown();
                        this.juzDropdown.classList.toggle('active');
                    });
                }

                // Header bookmark button
                const headerBookmarkBtn = document.getElementById('headerBookmarkBtn');
                if (headerBookmarkBtn) {
                    headerBookmarkBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        const isBookmarked = this.toggleBookmark(this.currentPage);
                        headerBookmarkBtn.classList.toggle('active', isBookmarked);
                        this.renderBookmarks();
                    });
                }

                // Prevent double-tap zoom on header (phone): block second tap if it's a double-tap
                const headerBar = document.querySelector('.header-bar');
                if (headerBar) {
                    let lastHeaderTap = 0;
                    let lastHeaderX = 0;
                    let lastHeaderY = 0;
                    const doubleTapMs = 400;
                    const doubleTapRadius = 50;
                    headerBar.addEventListener('touchend', (e) => {
                        const t = e.changedTouches[0];
                        lastHeaderTap = Date.now();
                        lastHeaderX = t.clientX;
                        lastHeaderY = t.clientY;
                    }, { passive: true });
                    headerBar.addEventListener('touchstart', (e) => {
                        if (e.touches.length !== 1) return;
                        const t = e.touches[0];
                        const now = Date.now();
                        const dx = t.clientX - lastHeaderX;
                        const dy = t.clientY - lastHeaderY;
                        if (now - lastHeaderTap < doubleTapMs && (dx * dx + dy * dy) < (doubleTapRadius * doubleTapRadius)) {
                            e.preventDefault();
                        }
                    }, { passive: false });
                }

                // Recalculate overlay positions on window resize
                window.addEventListener('resize', () => {
                    if (this.currentPage === 1) {
                        this.createAyahOverlays();
                    }
                });

                // Touch events for swiping
                this.pageContainer.addEventListener('touchstart', (e) => this.handleTouchStart(e), { passive: true });
                this.pageContainer.addEventListener('touchend', (e) => this.handleTouchEnd(e), { passive: true });

                // Keyboard navigation
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowLeft') {
                        this.goToPreviousPage();
                    } else if (e.key === 'ArrowRight') {
                        this.goToNextPage();
                    }
                });

                // Mouse drag support (for desktop)
                let isDragging = false;
                let startX = 0;

                this.pageContainer.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    startX = e.clientX;
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    e.preventDefault();
                });

                document.addEventListener('mouseup', (e) => {
                    if (!isDragging) return;
                    isDragging = false;
                    const diffX = startX - e.clientX;
                    if (Math.abs(diffX) > this.minSwipeDistance) {
                        if (diffX < 0) {
                            // Drag right - go forward (1->2->3...)
                            this.goToNextPage();
                        } else {
                            // Drag left - go backward (1->604->603...)
                            this.goToPreviousPage();
                        }
                    }
                });

                this.updateProgress();

                // Close bookmark modal with Escape key
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        this.closeBookmarkModal();
                    }
                });
            }

            handleTouchStart(e) {
                // Check if touch started on an ayah overlay
                const target = e.target;
                if (target && target.classList.contains('ayah-highlight')) {
                    // Don't track swipe if touching an ayah
                    this.touchStartX = null;
                    return;
                }
                this.touchStartX = e.changedTouches[0].screenX;
                this.touchStartY = e.changedTouches[0].screenY;
            }

            handleTouchEnd(e) {
                // Check if touch ended on an ayah overlay
                const target = e.target;
                if (target && target.classList.contains('ayah-highlight')) {
                    // Don't trigger swipe if touching an ayah
                    return;
                }

                if (this.touchStartX === null) {
                    return;
                }

                this.touchEndX = e.changedTouches[0].screenX;
                this.touchEndY = e.changedTouches[0].screenY;
                this.handleSwipe();
            }

            handleSwipe() {
                const swipeDistanceX = this.touchStartX - this.touchEndX;
                const swipeDistanceY = this.touchStartY - this.touchEndY;

                // Calculate the absolute distances
                const absX = Math.abs(swipeDistanceX);
                const absY = Math.abs(swipeDistanceY);

                // Only trigger swipe if:
                // 1. Horizontal movement is significant (more than minSwipeDistance)
                // 2. Horizontal movement is greater than vertical movement (to distinguish from scrolling)
                // 3. Vertical movement is not too large (user is scrolling, not swiping)
                if (absX > this.minSwipeDistance && absX > absY && absY < 100) {
                    if (swipeDistanceX < 0) {
                        // Swipe right - go forward (1->2->3...)
                        this.goToNextPage();
                    } else {
                        // Swipe left - go backward (1->604->603...)
                        this.goToPreviousPage();
                    }
                }
            }

            loadPage(pageNumber) {
                if (this.isLoading || pageNumber < 1 || pageNumber > this.totalPages) {
                    return;
                }

                this.isLoading = true;
                this.currentPage = pageNumber;
                // Persist last visited page
                localStorage.setItem('lastPage', String(this.currentPage));

                // Render text instead of image
                this.renderPageText(pageNumber);

                this.updateHeader();
                this.updateProgress();
                this.createAyahOverlays();

                // Ensure title is updated after a short delay to allow verses to load
                setTimeout(() => {
                    this.updatePageTitle();
                }, 100);

                this.isLoading = false;
            }

            goToNextPage() {
                if (this.isLoading) return;
                if (this.currentPage < this.totalPages) {
                    this.loadPage(this.currentPage + 1);
                } else {
                    this.loadPage(1);
                }
            }

            goToPreviousPage() {
                if (this.isLoading) return;
                if (this.currentPage > 1) {
                    this.loadPage(this.currentPage - 1);
                } else {
                    this.loadPage(this.totalPages);
                }
            }

            updateProgress() {
                const progress = (this.currentPage / this.totalPages) * 100;
                this.progressBar.style.width = `${progress}%`;
            }

            updatePlayPauseIcon(isPlaying) {
                const playIcon = document.getElementById('playIcon');
                const pauseIcon = document.getElementById('pauseIcon');
                if (playIcon && pauseIcon) {
                    if (isPlaying) {
                        playIcon.style.display = 'none';
                        pauseIcon.style.display = 'block';
                    } else {
                        playIcon.style.display = 'block';
                        pauseIcon.style.display = 'none';
                    }
                }
            }

            applyFontSize() {
                const savedFontSize = localStorage.getItem('fontSize') || '20'; // Default to 20px
                if (this.pageText) {
                    const sizeInPx = savedFontSize + 'px';
                    this.pageText.style.fontSize = sizeInPx;
                    console.log('Font size applied:', sizeInPx);
                }
            }

            toggleTranslation() {
                this.showTranslation = !this.showTranslation;
                // Re-render the current page to show/hide translations
                this.renderPageText(this.currentPage);
                // Save preference to localStorage
                localStorage.setItem('showTranslation', this.showTranslation);
                console.log('Translation toggled:', this.showTranslation);
            }

            togglePlayPause() {
                if (this.currentAudio) {
                    if (this.currentAudio.paused) {
                        this.currentAudio.play();
                        this.updatePlayPauseIcon(true);
                    } else {
                        this.currentAudio.pause();
                        this.updatePlayPauseIcon(false);
                    }
                } else {
                    // If no audio is playing, play the first ayah of current page
                    const pageData = this.ayahPositions?.find(p => p.page === this.currentPage);
                    if (pageData && pageData.ayahs && pageData.ayahs.length > 0) {
                        const surahNumber = pageData.surah || this.getSurahForPage(this.currentPage);
                        const firstAyah = pageData.ayahs[0].aya;
                        this.playAyahAudio(surahNumber, firstAyah);
                    }
                }
            }
        }

        // Initialize the viewer when the page loads
        let quranViewer = null;

        // Initialize dark mode from localStorage
        function initializeDarkMode() {
            if (localStorage.getItem('night') === 'true') {
                document.body.classList.add('dark');
            }
        }

        // Initialize dark mode immediately (before page renders)
        initializeDarkMode();

        // Initialize Tajweed colors preference
        function initializeTajweedColors() {
            const showColors = localStorage.getItem('showTajweedColors');
            if (showColors !== 'true') {
                document.body.classList.add('no-tajweed-colors');
                if (showColors === null) {
                    localStorage.setItem('showTajweedColors', 'false');
                }
            } else {
                document.body.classList.remove('no-tajweed-colors');
            }
        }

        // Initialize Tajweed colors immediately
        initializeTajweedColors();

        // Listen for Tajweed colors changes
        window.addEventListener('tajweedColorsChanged', () => {
            initializeTajweedColors();
            // Re-render current page if viewer is initialized
            if (window.quranViewer && window.quranViewer.currentPage) {
                window.quranViewer.renderPageText(window.quranViewer.currentPage);
            }
        });

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { scope: './' })
                    .then((registration) => {
                        console.log('Service Worker registered for offline:', registration.scope);
                    })
                    .catch((error) => {
                        console.warn('Service Worker registration failed:', error);
                    });
            });
        }

        // Install Prompt Handling
        let deferredPrompt;
        const installPrompt = document.getElementById('installPrompt');
        const installBtn = document.getElementById('installBtn');
        const installClose = document.getElementById('installClose');

        // Check if already installed
        function isInstalled() {
            return window.matchMedia('(display-mode: standalone)').matches ||
                window.navigator.standalone === true ||
                document.referrer.includes('android-app://');
        }

        // Check if iOS
        function isIOS() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        }

        // Show install prompt
        function showInstallPrompt() {
            if (!isInstalled() && installPrompt) {
                // Don't show if user dismissed it before
                if (localStorage.getItem('installPromptDismissed') !== 'true') {
                    // On iOS or if deferredPrompt is available, show the prompt
                    if (isIOS() || deferredPrompt) {
                        installPrompt.classList.add('show');
                    }
                }
            }
        }

        // Hide install prompt
        function hideInstallPrompt() {
            if (installPrompt) {
                installPrompt.classList.remove('show');
            }
        }

        // Listen for beforeinstallprompt event (Android/Chrome)
        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevent the mini-infobar from appearing on mobile
            e.preventDefault();
            // Stash the event so it can be triggered later
            deferredPrompt = e;
            // Show our custom install prompt after a short delay
            setTimeout(showInstallPrompt, 1500);
        });

        // For iOS and other browsers, show prompt after page load
        window.addEventListener('load', () => {
            // Wait a bit for beforeinstallprompt to fire (if it will)
            setTimeout(() => {
                if (!isInstalled() && !deferredPrompt && isIOS()) {
                    // On iOS, show prompt even without beforeinstallprompt
                    showInstallPrompt();
                } else if (!isInstalled() && deferredPrompt) {
                    // Android/Chrome - show if we have deferredPrompt
                    showInstallPrompt();
                }
            }, 2000);
        });

        // Install button click
        if (installBtn) {
            installBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    // Android/Chrome - use native install prompt
                    try {
                        deferredPrompt.prompt();
                        const { outcome } = await deferredPrompt.userChoice;
                        console.log(`User response to install prompt: ${outcome}`);
                        deferredPrompt = null;
                        hideInstallPrompt();
                    } catch (error) {
                        console.error('Error showing install prompt:', error);
                        hideInstallPrompt();
                    }
                } else if (isIOS()) {
                    // iOS - show instructions
                    hideInstallPrompt();
                    alert('لتثبيت التطبيق على iPhone:\n1. اضغط على زر المشاركة\n2. اختر "أضف إلى الشاشة الرئيسية"\n3. اضغط "إضافة"');
                }
            });
        }

        // Close button click
        if (installClose) {
            installClose.addEventListener('click', () => {
                hideInstallPrompt();
                // Remember that user dismissed it
                localStorage.setItem('installPromptDismissed', 'true');
            });
        }

        // Hide prompt if app is already installed
        if (isInstalled()) {
            hideInstallPrompt();
        }

        function initializeViewer() {
            console.log('Initializing QuranPageViewer...');
            quranViewer = new QuranPageViewer();

            // Floating Navigation Bar JavaScript
            // Wait for jQuery to be available
            if (typeof jQuery !== 'undefined') {
                jQuery(document).ready(function ($) {
                    // Label animation removed - no hover text effect

                    // Settings button - navigate to settings page
                    $("#navSettings").click(function (e) {
                        e.preventDefault();
                        window.location.href = 'setting.html';
                    });

                    // Book button - navigate to section
                    $("#navBook").attr('href', 'section.html');
                    $("#navBook").click(function (e) {
                        e.preventDefault();
                        window.location.href = 'section.html';
                    });

                    $("#navTranslate").click(function (e) {
                        e.preventDefault();
                        if (quranViewer) {
                            quranViewer.toggleTranslation();
                        }
                    });
