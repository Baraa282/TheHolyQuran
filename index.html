                    $("#navSearch").click(function (e) {
                        e.preventDefault();
                        window.location.href = 'search.html';
                    });

                    $("#navFavorite").click(function (e) {
                        e.preventDefault();
                        if (quranViewer) {
                            quranViewer.openBookmarkModal();
                        }
                    });

                    $("#navFocus").click(function (e) {
                        e.preventDefault();
                        if (quranViewer) {
                            quranViewer.toggleFocusMode();
                        }
                    });

                    $("#navRadio").click(function (e) {
                        e.preventDefault();
                        window.location.href = 'QuranSound-main/index.html';
                    });

                    $("#navKhatma").click(function (e) {
                        e.preventDefault();
                        window.location.href = 'kitma.html';
                    });

                    // Close bookmark modal
                    $("#bookmarkClose").click(function (e) {
                        e.preventDefault();
                        if (quranViewer) {
                            quranViewer.closeBookmarkModal();
                        }
                    });

                });
            } else {
                // Fallback if jQuery is not loaded - use vanilla JS
                document.getElementById('navSettings')?.addEventListener('click', function (e) {
                    e.preventDefault();
                    window.location.href = 'setting.html';
                });

                // Book button fallback - navigate to section
                const navBook = document.getElementById('navBook');
                if (navBook) {
                    navBook.setAttribute('href', 'section.html');
                    navBook.addEventListener('click', function (e) {
                        e.preventDefault();
                        window.location.href = 'section.html';
                    });
                }


                document.getElementById('navTranslate')?.addEventListener('click', function (e) {
                    e.preventDefault();
                    if (quranViewer) {
                        quranViewer.toggleTranslation();
                    }
                });

                document.getElementById('navSearch')?.addEventListener('click', function (e) {
                    e.preventDefault();
                    window.location.href = 'search.html';
                });

                // Bookmark button fallback
                document.getElementById('navFavorite')?.addEventListener('click', function (e) {
                    e.preventDefault();
                    if (quranViewer) {
                        quranViewer.openBookmarkModal();
                    }
                });

                document.getElementById('navFocus')?.addEventListener('click', function (e) {
                    e.preventDefault();
                    if (quranViewer) {
                        quranViewer.toggleFocusMode();
                    }
                });

                // Radio button fallback
                document.getElementById('navRadio')?.addEventListener('click', function (e) {
                    e.preventDefault();
                    window.location.href = 'QuranSound-main/index.html';
                });

                // Khatma Ramadan button fallback
                document.getElementById('navKhatma')?.addEventListener('click', function (e) {
                    e.preventDefault();
                    window.location.href = 'kitma.html';
                });

                // Close bookmark modal fallback
                document.getElementById('bookmarkClose')?.addEventListener('click', function (e) {
                    e.preventDefault();
                    if (quranViewer) {
                        quranViewer.closeBookmarkModal();
                    }
                });

            }
        }

        // Start initialization when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeViewer);
        } else {
            // DOM is already ready
            initializeViewer();
        }
    </script>
